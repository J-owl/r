
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정약용 인터뷰 테스트</title>
<style>
body { font-family: sans-serif; max-width: 560px; margin: auto; padding: 20px; background: #f2eee5; }
section { background: white; padding: 18px; border-radius: 14px; }
textarea, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
button { background: #315b46; color: white; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<section>
<h1>정약용과의 가상 인터뷰</h1>
<p>질문을 입력하면 답변을 보여 줍니다.</p>
<textarea id="q" placeholder="목민심서는 왜 쓰셨나요?"></textarea>
<button id="ask">질문하기</button>
<p id="answer">여기에 답변이 표시됩니다.</p>
<button id="voice">답변 듣기</button>
</section>
<script>
const q = document.getElementById("q");
const answer = document.getElementById("answer");
document.getElementById("ask").onclick = function () {
  const text = q.value.trim();
  if (!text) {
    answer.textContent = "먼저 질문을 입력해 주세요.";
  } else if (text.includes("목민심서")) {
    answer.textContent = "목민심서는 지방 수령이 백성을 올바르게 다스리는 방법을 정리한 책입니다.";
  } else if (text.includes("흠흠신서")) {
    answer.textContent = "흠흠신서는 형사 사건을 신중하게 조사하고 판결하는 방법을 다룬 책입니다.";
  } else {
    answer.textContent = "백성의 삶을 살피고 공정한 행정을 실천하는 것이 중요하다고 생각합니다.";
  }
};
document.getElementById("voice").onclick = function () {
  if (!("speechSynthesis" in window)) {
    answer.textContent += "\n이 브라우저에서는 음성 읽기를 지원하지 않습니다.";
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(answer.textContent);
  u.lang = "ko-KR";
  u.rate = 0.88;
  speechSynthesis.speak(u);
};
</script>
</body>
</html>
