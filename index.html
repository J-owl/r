
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정약용과의 가상 인터뷰</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #f2eee5; color: #29271f;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Noto Sans KR", sans-serif;
}
main { max-width: 560px; margin: auto; padding: 20px 16px 36px; }
header {
  background: #293e35; color: #fff8e9; border-radius: 18px;
  padding: 24px 20px; text-align: center;
}
h1 { font-size: 24px; margin: 0 0 10px; }
header p { margin: 0; line-height: 1.6; font-size: 14px; }
.panel {
  background: white; border-radius: 16px; padding: 18px;
  margin-top: 16px; box-shadow: 0 3px 12px #0000000b;
}
label { display: block; font-weight: 700; margin-bottom: 10px; }
textarea {
  width: 100%; min-height: 88px; resize: vertical; padding: 12px;
  border: 1px solid #c9c7bd; border-radius: 10px;
  font: inherit; font-size: 16px;
}
button {
  border: 0; border-radius: 11px; padding: 13px 15px;
  font: inherit; font-weight: 700; cursor: pointer;
}
button:focus, textarea:focus { outline: 3px solid #c3d7c8; }
.primary { background: #315b46; color: white; width: 100%; margin-top: 10px; }
.secondary { background: #e8eee8; color: #244333; width: 100%; margin-top: 9px; }
.small { background: #eee9df; color: #38352d; font-size: 14px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
#status { font-size: 14px; line-height: 1.6; color: #5a625a; margin: 12px 0 0; }
.speaker { font-size: 12px; color: #6d756d; margin-bottom: 7px; }
.bubble {
  background: #f5f3ed; border-radius: 12px; padding: 14px;
  line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere;
}
#answer { background: #eaf1e9; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples button { text-align: left; }
footer { text-align: center; font-size: 12px; color: #77756d; padding: 20px 6px; }
</style>
</head>
<body>
<main>
<header>
  <h1>정약용과의 가상 인터뷰</h1>
  <p>역사 자료를 바탕으로 정약용 선생과 대화해 보세요.<br>
  질문을 말하거나 직접 입력할 수 있습니다.</p>
</header>

<section class="panel">
  <label for="question">나의 질문</label>
  <textarea id="question" placeholder="예: 목민심서는 왜 쓰셨나요?"></textarea>
  <button id="ask" class="primary">질문하기</button>
  <div class="actions">
    <button id="mic" class="secondary">🎙️ 음성으로 질문</button>
    <button id="stopMic" class="small">음성인식 중지</button>
  </div>
  <p id="status" role="status" aria-live="polite">질문을 입력하거나 음성 버튼을 눌러 주세요.</p>
</section>

<section class="panel">
  <div class="speaker">나의 질문</div>
  <div id="shownQuestion" class="bubble">아직 질문하지 않았습니다.</div>
  <div class="speaker" style="margin-top:16px">정약용의 답변</div>
  <div id="answer" class="bubble">질문을 기다리고 있습니다.</div>
  <button id="speak" class="secondary">🔊 답변 다시 듣기</button>
  <button id="stopVoice" class="small" style="width:100%;margin-top:8px">음성 재생 중지</button>
</section>

<section class="panel">
  <label>질문 예시</label>
  <div class="examples">
    <button class="small example">목민심서는 왜 쓰셨나요?</button>
    <button class="small example">흠흠신서는 어떤 책인가요?</button>
    <button class="small example">백성을 위해 어떤 일을 하셨나요?</button>
    <button class="small example">유배 생활은 어떠셨나요?</button>
  </div>
</section>

<footer>교육용 가상 인터뷰 · AI 음성은 실제 정약용의 목소리가 아닙니다.</footer>
</main>

<script>
(function () {
  const question = document.getElementById("question");
  const askButton = document.getElementById("ask");
  const micButton = document.getElementById("mic");
  const stopMicButton = document.getElementById("stopMic");
  const speakButton = document.getElementById("speak");
  const stopVoiceButton = document.getElementById("stopVoice");
  const status = document.getElementById("status");
  const shownQuestion = document.getElementById("shownQuestion");
  const answerBox = document.getElementById("answer");

  let recognition = null;
  let lastAnswer = "";
  let listening = false;

  function setStatus(message) {
    status.textContent = message;
  }

  function answerQuestion(raw) {
    const q = raw.trim();
    if (!q) {
      setStatus("먼저 질문을 입력해 주세요.");
      question.focus();
      return;
    }

    shownQuestion.textContent = q;
    const text = q.replace(/\s/g, "");

    let answer;
    if (text.includes("목민심서") &&
        (text.includes("왜") || text.includes("이유") || text.includes("배경") || text.includes("무엇"))) {
      answer = "목민심서는 지방 수령이 백성을 어떻게 다스려야 하는지를 정리한 책이오. 관리가 사사로운 이익을 좇지 않고 백성을 위해 일해야 한다는 생각을 담았소. 내가 직접 보고 겪은 현실과 유교적 행정 원칙을 바탕으로 지방 행정의 문제를 바로잡고자 했소.";
    } else if (text.includes("흠흠신서")) {
      answer = "흠흠신서는 형사 사건을 조사하고 판결할 때 신중해야 한다는 점을 강조한 책이오. 사람의 생명과 관련된 판결은 억울함이 없도록 사실을 자세히 살피고, 증거를 신중하게 검토해야 한다고 보았소.";
    } else if (text.includes("서흥") || text.includes("현감")) {
      answer = "지방관의 중요한 임무는 백성을 보살피고 고을을 올바르게 다스리는 것이오. 어떤 관리의 행적을 평가할 때에는 백성에게 실제로 도움이 되었는지, 맡은 일을 공정하게 처리했는지를 살펴야 하오. 특정 인물이나 일화에 대한 질문이라면 수업에서 다룬 자료를 함께 확인하면 더 정확히 답할 수 있소.";
    } else if (text.includes("유배")) {
      answer = "유배 생활은 정치적으로 어려운 시기였지만, 학문을 깊이 연구하고 여러 저술을 남기는 시간이기도 했소. 현실의 문제를 살피며 백성의 삶을 개선할 방법을 고민했소.";
    } else if (text.includes("백성") || text.includes("개혁") || text.includes("정치")) {
      answer = "나라를 다스리는 일은 백성의 삶을 살피는 데서 출발해야 한다고 생각했소. 관리의 탐욕과 부패를 경계하고, 제도와 행정을 고쳐 백성의 부담을 줄이는 것이 중요하다고 보았소.";
    } else if (text.includes("거중기") || text.includes("수원 화성") || text.includes("화성")) {
      answer = "나는 실용적인 지식과 기술이 사회에 도움이 되어야 한다고 생각했소. 수원 화성 축성에 사용된 거중기는 무거운 물체를 들어 올리는 데 도움을 준 기구로 알려져 있소. 다만 화성 축성에는 여러 기술자와 기술이 함께 활용되었소.";
    } else if (text.includes("실학")) {
      answer = "실학은 실제 생활과 사회 문제에 도움이 되는 학문을 추구한 흐름이오. 나는 백성의 삶을 개선하고 행정과 제도를 바로잡는 데 학문이 쓰여야 한다고 생각했소.";
    } else if (text.includes("안녕") || text.includes("반갑")) {
      answer = "반갑소. 나는 정약용이라는 역사 인물을 바탕으로 재현된 가상 인터뷰 속 인물이오. 궁금한 점을 물어보시오.";
    } else {
      answer = "좋은 질문이오. 나는 백성의 삶을 개선하고, 관리의 책임과 공정한 행정을 중요하게 생각했소. 다만 이 질문에 대한 구체적인 역사적 사실은 확인된 자료를 바탕으로 답하는 것이 옳소. 수업에서 제공된 자료나 관련 문장을 입력하면 그 내용을 토대로 답변을 정리할 수 있소.";
    }

    lastAnswer = answer;
    answerBox.textContent = answer;
    setStatus("답변을 준비했습니다.");
    speakAnswer();
  }

  function speakAnswer() {
    if (!lastAnswer) {
      setStatus("먼저 질문을 해 주세요.");
      return;
    }
    if (!("speechSynthesis" in window)) {
      setStatus("이 브라우저에서는 음성 읽기를 지원하지 않습니다. 답변은 화면에서 확인해 주세요.");
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(lastAnswer);
    utterance.lang = "ko-KR";
    utterance.rate = 0.88;
    utterance.pitch = 0.85;
    utterance.onstart = function () { setStatus("정약용의 답변을 읽고 있습니다."); };
    utterance.onend = function () { setStatus("답변 읽기가 끝났습니다."); };
    utterance.onerror = function () { setStatus("음성 재생이 되지 않으면 답변을 화면에서 읽어 주세요."); };
    window.speechSynthesis.speak(utterance);
  }

  function stopListening() {
    if (recognition && listening) {
      try { recognition.stop(); } catch (e) {}
    }
    listening = false;
    micButton.disabled = false;
  }

  askButton.addEventListener("click", function () {
    answerQuestion(question.value);
  });

  question.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      answerQuestion(question.value);
    }
  });

  document.querySelectorAll(".example").forEach(function (button) {
    button.addEventListener("click", function () {
      question.value = button.textContent;
      answerQuestion(question.value);
    });
  });

  speakButton.addEventListener("click", speakAnswer);

  stopVoiceButton.addEventListener("click", function () {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setStatus("음성 재생을 중지했습니다.");
  });

  stopMicButton.addEventListener("click", function () {
    stopListening();
    setStatus("음성인식을 중지했습니다. 질문을 직접 입력해도 됩니다.");
  });

  micButton.addEventListener("click", function () {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      setStatus("이 브라우저에서는 음성인식을 지원하지 않습니다. 위 입력창에 질문을 직접 입력해 주세요.");
      question.focus();
      return;
    }

    try {
      recognition = new SpeechRecognition();
      recognition.lang = "ko-KR";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = function () {
        listening = true;
        micButton.disabled = true;
        setStatus("듣고 있습니다. 질문을 말씀해 주세요.");
      };

      recognition.onresult = function (event) {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        question.value = transcript;
        setStatus("인식한 내용: " + transcript);
        const latest = event.results[event.results.length - 1];
        if (latest && latest.isFinal) {
          answerQuestion(transcript);
        }
      };

      recognition.onerror = function (event) {
        const messages = {
          "not-allowed": "마이크 권한이 차단되어 있습니다. Safari 설정에서 마이크 권한을 확인하거나 질문을 직접 입력해 주세요.",
          "service-not-allowed": "브라우저의 음성인식 서비스를 사용할 수 없습니다. 질문을 직접 입력해 주세요.",
          "network": "음성인식 네트워크 오류입니다. 인터넷 연결을 확인하거나 직접 입력해 주세요.",
          "no-speech": "음성이 감지되지 않았습니다. 다시 누르고 또렷하게 말씀해 주세요.",
          "audio-capture": "마이크를 사용할 수 없습니다. 마이크 설정을 확인해 주세요."
        };
        setStatus(messages[event.error] || ("음성인식 오류: " + event.error + ". 질문을 직접 입력해도 됩니다."));
      };

      recognition.onend = function () {
        listening = false;
        micButton.disabled = false;
      };

      recognition.start();
    } catch (error) {
      listening = false;
      micButton.disabled = false;
      setStatus("음성인식을 시작하지 못했습니다. 질문을 직접 입력해 주세요.");
    }
  });
})();
</script>
</body>
</html>
